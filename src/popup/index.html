<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkPeek</title>
    <link rel="stylesheet" href="../ui/page.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="row">
      <h1><img src="/icons/icon-32.png" alt="" /><span data-brand-name>LinkPeek</span></h1>
      <span class="muted" data-installed>Installed. v<span data-version></span></span>
    </header>
    <main id="popup-main">
      <section id="mode-section"></section>
      <section id="site-section" aria-labelledby="site-heading">
        <h2 id="site-heading">This site</h2>
        <div class="row">
          <span>
            <span class="site-name" id="site-name"></span><br />
            <span class="muted" id="site-state"></span>
          </span>
          <button type="button" class="secondary" id="site-toggle" hidden></button>
        </div>
      </section>
      <section id="annoyance-section" aria-labelledby="annoyance-heading" hidden>
        <h2 id="annoyance-heading">Annoyance tools on this site</h2>
        <p class="muted">Off unless you turn them on. They work on pages where LinkPeek runs.</p>
        <div id="annoyance-list"></div>
        <button type="button" class="secondary" id="annoyance-undo">Undo on this page</button>
        <p class="muted status-line" id="annoyance-status" role="status"></p>
      </section>
      <section>
        <button type="button" class="primary" id="scan">Scan this page</button>
        <p class="muted status-line" id="scan-status" role="status"></p>
      </section>
      <section class="row">
        <a href="#" id="open-options">Settings</a>
        <span class="muted">Shortcut: <kbd id="shortcut">Alt+Shift+P</kbd></span>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
